<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sneed — GitHub contribution graph in 3D</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --green:#39d353; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif; overflow:hidden; }
  #scene { position:absolute; inset:0; }

  #bar { position:fixed; top:0; left:0; right:0; z-index:10;
    display:flex; align-items:center; gap:12px; padding:14px 18px;
    background:rgba(13,17,23,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  #bar h1 { font-size:18px; margin:0; font-weight:700; letter-spacing:.3px; }
  #bar h1 span { color:var(--green); }
  #search { display:flex; gap:8px; margin-left:auto; }
  input[type=text] {
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:6px; padding:8px 12px; font-size:14px; outline:none; width:220px; }
  input[type=text]:focus { border-color:var(--green); }
  button {
    background:#238636; border:none; color:#fff; font-weight:600; font-size:14px;
    padding:8px 16px; border-radius:6px; cursor:pointer; }
  button:hover { background:#2ea043; }
  button:disabled { opacity:.5; cursor:default; }

  #meta { position:fixed; left:18px; bottom:18px; z-index:10; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:12px 16px; min-width:230px;
    font-size:13px; line-height:1.5; }
  #meta .u { font-size:15px; font-weight:700; }
  #meta .muted { color:var(--muted); }
  #tooltip { position:fixed; z-index:10; pointer-events:none; display:none;
    background:rgba(22,27,34,.95); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-size:13px; transform:translate(-50%,-130%); white-space:nowrap; }

  #legend { position:fixed; right:18px; bottom:18px; z-index:10; background:var(--panel);
    border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12px; color:var(--muted); }
  #legend .cells { display:flex; gap:4px; margin-top:6px; }
  .cell { width:14px; height:14px; border-radius:3px; }

  #statusbox { position:fixed; top:74px; left:50%; transform:translateX(-50%); z-index:20;
    background:#3d1d1d; border:1px solid #c6534c; color:#ffb4ab; padding:10px 16px;
    border-radius:8px; font-size:14px; display:none; max-width:80%; text-align:center; }
  .hint { color:var(--muted); font-size:12px; }
  #speed { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); }
  #speed input[type=range] { width:120px; accent-color:var(--green); cursor:pointer; }
  #speed b { min-width:34px; text-align:right; font-variant-numeric:tabular-nums; color:var(--text); }
  @media (max-width:700px){ .hint{ display:none; } #meta{ min-width:170px; } #speed{ display:none; } }
</style>
</head>
<body>
  <div id="bar">
    <h1><span>sneed</span> · contribution graph in 3D</h1>
    <div id="search">
      <input type="text" id="q" placeholder="GitHub username…" autocomplete="off" spellcheck="false" />
      <button id="go">View in 3D</button>
    </div>
    <span class="hint">drag to rotate · scroll to zoom · w/a/s/d or arrows to move · cursor steers · hover for details · +/− speed</span>
    <div id="speed" title="Keyboard movement speed">
      <label>speed</label>
      <input type="range" id="speedRange" min="5" max="200" value="20" />
      <b id="speedVal">0.2×</b>
    </div>
  </div>

  <div id="scene"></div>
  <div id="statusbox"></div>
  <div id="meta">
    <div class="u" id="metaUser">—</div>
    <div class="muted" id="metaDates"></div>
    <div class="muted" id="metaSummary"></div>
  </div>
  <div id="legend">activity<div class="cells" id="legendCells"></div></div>
  <div id="tooltip"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
  import * as THREE from "three";
  import { OrbitControls } from "three/addons/controls/OrbitControls.js";

  const LEVELS = ["#272c34", "#0e4429", "#006d32", "#26a641", "#39d353"];
  const COLORS = LEVELS.map((c) => new THREE.Color(c));

  // ---- scene setup ----
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#0d1117");
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 5000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  document.getElementById("scene").appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2.05;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x0d1117, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(1, 2, 1); scene.add(key);
  const fill = new THREE.DirectionalLight(0x88b0ff, 0.35); fill.position.set(-1, 0.5, -1); scene.add(fill);

  const grid = new THREE.GridHelper(1200, 120, 0x30363d, 0x21262d);
  scene.add(grid);
  const base = new THREE.Mesh(
    new THREE.PlaneGeometry(1200, 1200),
    new THREE.MeshBasicMaterial({ color: 0x0d1117, transparent: true, opacity: 0.6 })
  );
  base.rotation.x = -Math.PI / 2; base.position.y = -0.05; scene.add(base);

  const barGroup = new THREE.Group();
  scene.add(barGroup);

  let barMeshes = [];
  let daysData = [];
  const tooltip = document.getElementById("tooltip");

  renderer.setAnimationLoop(animate);
  function animate() { kbMove(); controls.update(); renderer.render(scene, camera); }

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  }
  addEventListener("resize", resize);
  resize();

  // ---- keyboard camera controls (WASD + arrow keys, cursor steering) ----
  // While a move key is held: the view turns so whatever sits under the pointer is
  // brought to the center of the screen (true "camera follows the mouse" — no button),
  // and the camera glides in the WASD/arrow direction. On release we re-anchor the
  // orbit pivot at the new vantage point so drag/scroll continue seamlessly.
  const MOVE_KEYS = new Set(["w", "a", "s", "d", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]);
  let held = new Set();
  let mouseNdc = { x: 0, y: 0 }; // last pointer position in -1..1 screen space
  let fwd = new THREE.Vector3(0, 0, -1);   // current view direction (unit)
  let yawCur = 0, pitchCur = 0;            // eased heading, in radians
  let yawRef = 0, pitchRef = 0;            // heading captured when this press started
  let steeringRef = false;                 // reference captured this press yet?
  const steerPos = new THREE.Vector3();
  const steerHor = new THREE.Vector3();
  const steerRight = new THREE.Vector3();
  const WORLD_UP = new THREE.Vector3(0, 1, 0);
  const EASE = 0.18;   // how quickly the view chases the cursor
  const MIN_PITCH = -0.5;          // look-down floor (radians); default framing already ~ -0.4
  const MAX_PITCH = Math.PI / 2 - 0.05; // never tilt past straight up/overhead
  let moveSpeed = 0.2;             // × multiplier on the base keyboard travel speed (0.02 of orbit distance/frame)
  const speedRange = document.getElementById("speedRange");
  const speedVal = document.getElementById("speedVal");
  function setSpeed(v, store = true) {
    moveSpeed = v;
    speedRange.value = Math.round(v * 100);
    speedVal.textContent = v.toFixed(1) + "×";
    if (store) localStorage.setItem("sneed:moveSpeed", String(v));
  }
  const storedSpeed = parseFloat(localStorage.getItem("sneed:moveSpeed"));
  setSpeed(Number.isFinite(storedSpeed) ? Math.min(2, Math.max(0.05, storedSpeed)) : 0.2, false);
  speedRange.addEventListener("input", () => setSpeed(Number(speedRange.value) / 100));

  // +/- speed hotkeys (also nudge the slider)
  function nudgeSpeed(d) { setSpeed(Math.min(2, Math.max(0.05, moveSpeed * (d > 0 ? 1.25 : 0.8)))); }

  function headingToDir(yaw, pitch) {
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch);
    return new THREE.Vector3(cp * sy, Math.sin(pitch), cp * cy);
  }

  function kbMove() {
    if (held.size === 0) { steeringRef = false; return; }

    // capture the initial heading once when this key-press starts
    if (!steeringRef) {
      fwd.copy(controls.target).sub(camera.position).normalize();
      const h = Math.hypot(fwd.x, fwd.z);
      pitchCur = Math.atan2(fwd.y, h);
      yawCur = Math.atan2(fwd.x, fwd.z);
      yawRef = yawCur; pitchRef = pitchCur;
      steeringRef = true;
    }

    // target heading = starting heading + the angular offset of the cursor from center,
    // so the point under the pointer is pulled to the middle of the screen
    const tanH = Math.tan((camera.fov / 2) * Math.PI / 180);
    const aspect = innerWidth / innerHeight;
    const tYaw = yawRef + Math.atan(tanH * aspect * mouseNdc.x);
    const tPitch = Math.min(MAX_PITCH, Math.max(MIN_PITCH, pitchRef + Math.atan(tanH * mouseNdc.y)));
    yawCur += (tYaw - yawCur) * EASE;
    pitchCur += (tPitch - pitchCur) * EASE;
    fwd.copy(headingToDir(yawCur, pitchCur));

    // movement basis: forward projected flat, and its horizontal right
    steerHor.copy(fwd); steerHor.y = 0;
    if (steerHor.lengthSq() < 1e-10) steerHor.set(0, 0, -1); else steerHor.normalize();
    steerRight.crossVectors(steerHor, WORLD_UP);

    const step = camera.position.distanceTo(controls.target) * 0.02 * moveSpeed;
    let vf = 0, vr = 0;
    if (held.has("w") || held.has("ArrowUp")) vf += 1;
    if (held.has("s") || held.has("ArrowDown")) vf -= 1;
    if (held.has("d") || held.has("ArrowRight")) vr += 1;
    if (held.has("a") || held.has("ArrowLeft")) vr -= 1;
    const rOld = controls.target.distanceTo(camera.position);
    steerPos.copy(camera.position)
      .addScaledVector(steerHor, vf * step)
      .addScaledVector(steerRight, vr * step);
    camera.position.copy(steerPos);
    // keep the orbit distance and aim the pivot along the (steered) heading
    controls.target.copy(camera.position).addScaledVector(fwd, Math.max(rOld, 0.01));
  }

  addEventListener("keydown", (e) => {
    // let typed text (username search) through without nudging the camera
    const t = e.target && e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA") return;
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === "+" || k === "=") { nudgeSpeed(1); e.preventDefault(); return; }
    if (k === "-" || k === "_") { nudgeSpeed(-1); e.preventDefault(); return; }
    if (MOVE_KEYS.has(k)) { held.add(k); e.preventDefault(); }
  });
  addEventListener("keyup", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    held.delete(k);
  });
  addEventListener("blur", () => held.clear());

  // ---- build a continuous single-line timeline (weeks left→right, days top→bottom) ----
  // A fixed Monday-anchored epoch keeps week columns continuous across every year, so
  // the whole history is one unbroken strip rather than separate year blocks.
  function layoutDays(days) {
    const spacing = 1.0;
    const epoch = new Date(2011, 0, 3); // a Monday
    const placed = [];
    for (let i = 0; i < days.length; i++) {
      const d = days[i];
      const date = new Date(d.date + "T00:00:00");
      const dayN = Math.floor((date - epoch) / 86400000);
      const col = Math.floor(dayN / 7);
      const row = date.getDay(); // 0 Sun ... 6 Sat (Sun on top)
      placed.push({
        date: d.date,
        count: d.count,
        x: col * spacing,
        z: (row - 3) * spacing,
      });
    }
    return placed;
  }

  function renderGraph(data) {
    barGroup.clear();
    barMeshes = [];
    daysData = [];

    const placed = layoutDays(data.days);
    const max = Math.max(...placed.map((p) => p.count), 1);
    const maxH = 14, barW = 1.15, barD = 0.9;
    const N = placed.length;
    const geom = new THREE.BoxGeometry(barW, 1, barD);
    const mat = new THREE.MeshStandardMaterial({ roughness: 0.4, metalness: 0.08 });
    const bars = new THREE.InstancedMesh(geom, mat, N);
    bars.count = N;
    const dummy = new THREE.Object3D();
    const colorArr = new Float32Array(N * 3);
    const colorObj = new THREE.Color();

    // center the whole field on the origin
    const xs = placed.map((p) => p.x);
    const cx0 = (Math.min(...xs) + Math.max(...xs)) / 2;

    for (let i = 0; i < N; i++) {
      const p = placed[i];
      const h = p.count > 0 ? Math.max(0.15, (p.count / max) * maxH) : 0.08;
      dummy.position.set(p.x - cx0, h / 2, p.z);
      dummy.scale.set(1, h, 1);
      dummy.updateMatrix();
      bars.setMatrixAt(i, dummy.matrix);
      const lvl = p.count <= 0 ? 0 : p.count >= max ? 4 : Math.max(1, Math.round((p.count / max) * 4));
      colorObj.set(COLORS[lvl]);
      colorArr[i * 3] = colorObj.r;
      colorArr[i * 3 + 1] = colorObj.g;
      colorArr[i * 3 + 2] = colorObj.b;
      daysData.push({ date: p.date, count: p.count });
    }
    bars.instanceColor = new THREE.InstancedBufferAttribute(colorArr, 3);
    barGroup.add(bars);
    barMeshes = [bars];

    // frame the whole field, keeping bars big enough to read
    const xr = placed.map((p) => p.x);
    const zr = placed.map((p) => p.z);
    const x0 = Math.min(...xr), x1 = Math.max(...xr);
    const z0 = Math.min(...zr), z1 = Math.max(...zr);
    const fcx = (x0 + x1) / 2, fcz = (z0 + z1) / 2;
    const size = Math.max(x1 - x0, z1 - z0, 8);
    const afov = (25 * Math.PI) / 180;
    const dist = (size / 2 + 6) / (Math.tan(afov) * (innerWidth / innerHeight)) * 1.15;
    camera.position.set(fcx, dist * 0.5, fcz + dist);
    controls.target.set(fcx, 1.5, fcz);
    controls.update();

    const total = data.days.reduce((s, d) => s + d.count, 0);
    const busy = data.days.filter((d) => d.count > 0).length;
    const years = new Set(data.days.map((d) => d.date.slice(0, 4))).size;
    document.getElementById("metaUser").textContent = data.user;
    document.getElementById("metaDates").textContent = data.days.length
      ? `${data.days[0].date} → ${data.days[data.days.length - 1].date}` : "no data";
    document.getElementById("metaSummary").textContent =
      `${years} year${years === 1 ? "" : "s"} · ${total} contributions · ${busy} active days`;
  }

  // ---- hover readout ----
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  renderer.domElement.addEventListener("pointermove", (e) => {
    ndc.x = (e.clientX / innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / innerHeight) * 2 + 1;
    mouseNdc.x = ndc.x; mouseNdc.y = ndc.y;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(barMeshes, false);
    if (hits.length && hits[0].instanceId != null) {
      const d = daysData[hits[0].instanceId];
      tooltip.style.display = "block";
      tooltip.style.left = e.clientX + "px";
      tooltip.style.top = e.clientY + "px";
      tooltip.innerHTML = `<b>${d.date}</b> · ${d.count} contribution${d.count === 1 ? "" : "s"}`;
    } else tooltip.style.display = "none";
  });

  // legend
  const lc = document.getElementById("legendCells");
  LEVELS.forEach((c) => {
    const div = document.createElement("div");
    div.className = "cell"; div.style.background = c; lc.appendChild(div);
  });

  // ---- data source: client-side (works on static hosts), no token needed ----
  async function fetchContributions(username) {
    // Primary: jogruber's public GitHub-contributions mirror (CORS enabled)
    const url = `https://github-contributions-api.jogruber.de/v4/${encodeURIComponent(username)}`;
    const res = await fetch(url, { headers: { Accept: "application/json" } });
    if (res.status === 404) throw new Error(`GitHub user "${username}" not found`);
    if (!res.ok) throw new Error(`Contribution API error (${res.status})`);
    const json = await res.json();
    const days = (json.contributions || [])
      .map((c) => ({ date: c.date, count: c.count || 0 }))
      .sort((a, b) => (a.date < b.date ? -1 : 1)); // oldest → newest
    return { user: username, days, max: days.reduce((m, d) => Math.max(m, d.count), 0) };
  }

  async function load(user) {
    const btn = document.getElementById("go");
    btn.disabled = true;
    const status = document.getElementById("statusbox");
    status.style.display = "none";
    const q = document.getElementById("q");
    if (q.value !== user) q.value = user;
    try {
      renderGraph(await fetchContributions(user));
    } catch (e) {
      status.textContent = e.message;
      status.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("go").addEventListener("click", () => {
    const v = document.getElementById("q").value.trim();
    if (v) load(v);
  });
  document.getElementById("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { const v = e.target.value.trim(); if (v) load(v); }
  });

  // start with a fun default (override with ?u=username)
  const initialUser = new URLSearchParams(location.search).get("u") || "sudo-rm-rf";
  load(initialUser);
  </script>
</body>
</html>
